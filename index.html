// Strips stray inline color/font styling that old pasted content can carry,
// which otherwise silently overrides the app's CSS (even !important rules)
// because inline styles win the cascade. Only touches color/background-color/
// font-size/font-family — never layout properties (margin, width, float, etc.)
// so images, dividers, and wrap-img spacing are untouched. Purely a display-time
// fix: never mutates what's actually saved in Firebase.
function sanitizeLessonHtml(html){
  if(!html) return html;
  try{
    const tmp=document.createElement("div");
    tmp.innerHTML=html;
    tmp.querySelectorAll("*").forEach(el=>{
      if(el.style){
        el.style.removeProperty("color");
        el.style.removeProperty("background-color");
        el.style.removeProperty("font-size");
        el.style.removeProperty("font-family");
      }
    });
    return tmp.innerHTML;
  }catch(e){
    return html;
  }
}

const STATUS_STYLE={
  "on-time":{fg:"#7C9270",bg:"#EEF2E9",label:"Completed on time",Icon:IconLeaf},
  late:{fg:"#B08B1F",bg:"#FBF3DC",label:"Completed late",Icon:IconMoon},

// Given a lesson's dueAt and a student's response (or lack of one), compute completion status.
const completionStatus=(lesson,response)=>{
  if(!lesson.dueAt)return response?"on-time":"pending";
  const due=new Date(lesson.dueAt).getTime();
  if(response){const submitted=new Date(response.submittedAt).getTime();return submitted<=due?"on-time":"late";}
  return Date.now()>due?"missed":"pending";
};
// Streak = consecutive weekly lessons (by lesson order) completed on time, most recent first.
const computeStreak=(lessons,responses)=>{
  const byId={};responses.forEach(r=>{byId[r.lessonId]=r;});
  const dueLessons=[...lessons].filter(l=>l.dueAt&&new Date(l.dueAt).getTime()<=Date.now()).sort((a,b)=>b.id-a.id);
  let streak=0;
  for(const l of dueLessons){
    const status=completionStatus(l,byId[l.id]);
    if(status==="on-time")streak++;
    else break;
  }
  return streak;
};

const setSession=d=>{session={idToken:d.idToken,refreshToken:d.refreshToken,expiresAt:Date.now()+Number(d.expiresIn)*1000-60000,uid:d.localId,email:d.email};};
const clearSession=()=>{session={idToken:null,refreshToken:null,expiresAt:0,uid:null,email:null};};
const authRequest=async(path,body)=>{
  const r=await fetch(`${IDENTITY_URL}/accounts:${path}?key=${FIREBASE_API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok)throw new Error(d?.error?.message||"AUTH_ERROR");
  return d;
};
const authSignUp=(email,password)=>authRequest("signUp",{email,password,returnSecureToken:true});
const authSignIn=(email,password)=>authRequest("signInWithPassword",{email,password,returnSecureToken:true});
const authRefresh=async()=>{
  if(!session.refreshToken)return null;
  try{
    const r=await fetch(`${REFRESH_URL}?key=${FIREBASE_API_KEY}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=refresh_token&refresh_token=${session.refreshToken}`});
    const d=await r.json();
    if(!r.ok)return null;
    session={...session,idToken:d.id_token,refreshToken:d.refresh_token,expiresAt:Date.now()+Number(d.expires_in)*1000-60000};
    return session.idToken;
  }catch{return null;}
};
const getToken=async()=>{if(session.idToken&&Date.now()<session.expiresAt)return session.idToken;return await authRefresh();};

const pad=n=>String(n).padStart(2,"0");

// ── BATCH INDEX ──
// A small, public-read map of every batch that's ever existed: {batchId: {name,status,order}}.
// Lets the welcome screen figure out which batch a name belongs to without
// needing to know batch IDs in advance. Admin-only write.
const loadBatchIndex=()=>rtGet(`${DATA_ROOT}/_index`).then(d=>d||{});
const saveBatchIndexEntry=(batchId,entry)=>rtSet(`${DATA_ROOT}/_index/${batchId}`,entry);

const accessState=(meta)=>{
  // "active": course still running, no window countdown yet.
  // "window": course marked complete, within the post-course access window.
  // "locked": window has closed.
  if(!meta)return"active";
  if(meta.status==="active")return"active";
  if(!meta.completedAt)return"active";
  const windowDays=meta.windowDays||DEFAULT_WINDOW_DAYS;
  const deadline=new Date(meta.completedAt).getTime()+windowDays*86400000;
  return Date.now()<deadline?"window":"locked";
};
const daysLeft=(meta)=>{
  if(!meta?.completedAt)return null;
  const windowDays=meta.windowDays||DEFAULT_WINDOW_DAYS;
  const deadline=new Date(meta.completedAt).getTime()+windowDays*86400000;
  return Math.max(0,Math.ceil((deadline-Date.now())/86400000));
};
// A per-student extension (grantedUntil) overrides a locked batch for that one student.
const studentAccessAllowed=(meta,regEntry)=>{
  const state=accessState(meta);
  if(state!=="locked")return true;
  if(regEntry?.extendedUntil&&Date.now()<new Date(regEntry.extendedUntil).getTime())return true;
  return false;
};

// canWrite=true only for admin: students can read lessons but the "auto release by
// scheduled date" write-back is an admin-only action under the new rules anyway.
const loadLessons=async(batchId,lessonCount,canWrite=false)=>{
  const n=lessonCount||20;
  const results=await Promise.all(Array.from({length:n},(_,i)=>rtGet(bp(batchId,`lessons/${i+1}`))));
  let lessons=results.map((l,i)=>l||mkLesson(i+1));
  const today=todayISO();let changed=false;
  lessons=lessons.map(l=>{let u={...l};
    if(!u.readingReleased&&u.readingScheduledDate&&u.readingScheduledDate<=today){u={...u,readingReleased:true,readingReleaseDate:fmtDate(u.readingScheduledDate+"T00:00:00")};changed=true;}
    if(!u.summaryReleased&&u.summaryScheduledDate&&u.summaryScheduledDate<=today){u={...u,summaryReleased:true,summaryReleaseDate:fmtDate(u.summaryScheduledDate+"T00:00:00")};changed=true;}
    if(!u.quizReleased&&u.quizScheduledDate&&u.quizScheduledDate<=today){u={...u,quizReleased:true,quizReleaseDate:fmtDate(u.quizScheduledDate+"T00:00:00")};changed=true;}
    return u;});
  if(changed&&canWrite)await Promise.all(lessons.map(l=>rtSet(bp(batchId,`lessons/${l.id}`),l)));
  return lessons;
};
const saveLesson=(batchId,l)=>rtSet(bp(batchId,`lessons/${l.id}`),l);

};

const loadMyFeedback=async(batchId,uid)=>{const d=await rtGet(bp(batchId,`feedback/${uid}`));return d?Object.values(d).filter(Boolean):[];};

const submitExtensionRequest=(batchId,uid,name,note)=>rtSet(bp(batchId,`extensionRequests/${uid}`),{name,note,requestedAt:new Date().toISOString(),status:"pending"});
const loadExtensionRequests=async(batchId)=>{const d=await rtGet(bp(batchId,"extensionRequests"));return d||{};};
const resolveExtensionRequest=async(batchId,uid,granted)=>{
  await rtDel(bp(batchId,`extensionRequests/${uid}`));
  if(granted){
    const until=new Date(Date.now()+EXTENSION_GRANT_DAYS*86400000).toISOString();
    const reg=await rtGet(bp(batchId,"registeredNames"))||{};
    const matchKey=Object.keys(reg).find(k=>(typeof reg[k]==="object"?reg[k].uid:reg[k])===uid);
    if(matchKey){
      const cur=reg[matchKey];
      const curUid=typeof cur==="string"?cur:cur.uid;
      await rtSet(bp(batchId,`registeredNames/${matchKey}`),{uid:curUid,extendedUntil:until});
    }
  }
  return true;
};

// ── RICH EDITOR ──
const RichEditor=({value,onChange,placeholder,variant})=>{
  const ref=useRef(null);const[imgUrl,setImgUrl]=useState("");const[imgMode,setImgMode]=useState(null);const mounted=useRef(false);
  const savedRange=useRef(null);
  useEffect(()=>{if(!mounted.current&&ref.current){ref.current.innerHTML=value||"";mounted.current=true;}},[]);
  useEffect(()=>{try{document.execCommand("defaultParagraphSeparator",false,"p");}catch(e){}},[]);
  const saveSelection=()=>{const sel=window.getSelection();if(sel&&sel.rangeCount>0&&ref.current&&ref.current.contains(sel.anchorNode)){savedRange.current=sel.getRangeAt(0).cloneRange();}};
  const restoreSelection=()=>{ref.current?.focus();const sel=window.getSelection();if(sel&&savedRange.current){sel.removeAllRanges();sel.addRange(savedRange.current);}};
  const exec=(cmd,val=null)=>{document.execCommand(cmd,false,val);ref.current?.focus();};
  const tb={padding:"5px 8px",borderRadius:6,border:`1px solid ${B.sage}`,background:"white",cursor:"pointer",color:B.adminDark,fontSize:13};
  const insertImage=()=>{
    if(!imgUrl.trim())return;
    restoreSelection();
    const html=imgMode==="wrap"
      ?`<img class="wrap-img" src="${imgUrl}"/>`
      :`<br/><img src="${imgUrl}" style="display:block;max-width:100%;border-radius:8px;margin:14px 0"/><br/>`;
    exec("insertHTML",html);setImgUrl("");setImgMode(null);
  };
  const insertDivider=()=>{
    exec("insertHTML",`<br/><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0" contenteditable="false"><div style="width:40px;height:1.5px;background:linear-gradient(to left,#E0B515,transparent)"></div><div style="width:6px;height:6px;border-radius:50%;background:#E0B515"></div><div style="width:40px;height:1.5px;background:linear-gradient(to right,#E0B515,transparent)"></div></div><br/>`);
  };
  return(<div style={{border:`1px solid ${B.sage}`,borderRadius:10,overflow:"hidden"}}>
    <div style={{display:"flex",flexWrap:"wrap",gap:4,padding:"7px 10px",background:"#f5f2ec",borderBottom:`1px solid ${B.sage}`}}>
      <button style={tb} onMouseDown={e=>{e.preventDefault();exec("formatBlock","H2")}}>H2</button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();exec("formatBlock","H3")}}>H3</button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();exec("formatBlock","H4")}}>H4</button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();exec("formatBlock","P")}}>Normal</button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();exec("bold")}}><b>B</b></button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();exec("italic")}}><i>I</i></button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();exec("insertUnorderedList")}}>• List</button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();saveSelection();setImgMode(m=>m==="full"?null:"full")}} title="Full-width image">🖼 Full</button>
      <button style={tb} onMouseDown={e=>{e.preventDefault();saveSelection();setImgMode(m=>m==="wrap"?null:"wrap")}} title="Small image, text wraps around it">🖼 Small</button>
      {variant==="reading"&&<button style={{...tb,background:"#fff8e6",border:"1px solid #E0B515",color:"#8a6800",fontWeight:600}} onMouseDown={e=>{e.preventDefault();insertDivider();}}>— Divider</button>}
    </div>
    {imgMode&&<div style={{display:"flex",gap:6,padding:"7px 10px",background:"#ede9e2"}}>
      <input value={imgUrl} onChange={e=>setImgUrl(e.target.value)} placeholder="Paste image URL…" style={{flex:1,padding:"5px 9px",borderRadius:7,border:`1px solid ${B.sage}`,fontSize:13}}/>
      <button onMouseDown={e=>{e.preventDefault();insertImage();}} style={{...tb,background:B.green,color:"white",border:"none",padding:"5px 12px"}}>Insert {imgMode==="wrap"?"Small":"Full-width"}</button>
    </div>}
    <div ref={ref} contentEditable suppressContentEditableWarning data-placeholder={placeholder||"Start writing…"} onInput={()=>onChange(ref.current.innerHTML)} onPaste={e=>{
      e.preventDefault();
      const text=(e.clipboardData||window.clipboardData).getData("text/plain");
      const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const html=text.split(/\r?\n/).map(line=>`<div>${line.trim()?esc(line):"<br>"}</div>`).join("");
      document.execCommand("insertHTML",false,html);
    }} className={variant==="reading"?"rich-editor rich-editor-reading":"rich-editor"}/>
  </div>);
};

// ── ADMIN SETTINGS ──
const AdminSettings=({batchId,meta,whitelist,extensionRequests,onSaveWhitelist,onMarkComplete,onSetNextSession,onResolveExtension})=>{

  const rem=name=>setWl(p=>p.filter(x=>x!==name));
  const doSave=async()=>{setSaving(true);await onSaveWhitelist(wl);setSaving(false);setToast("Whitelist saved ✓");};
  const saveSession=async()=>{setSaving(true);await onSetNextSession(nextSession?new Date(nextSession).toISOString():null);setSaving(false);setToast("Next session saved ✓");};

    {requests.length>0&&<div style={{background:"#FBEDED",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
      <div style={{fontSize:12.5,fontWeight:600,color:"#a55",marginBottom:8}}>Access requests</div>
      {requests.map(([uid,r])=>(<div key={uid} style={{marginBottom:8}}>
        <div style={{fontSize:13,color:B.adminDark,fontWeight:600}}>{r.name}</div>
        <div style={{fontSize:12,color:B.purple,marginBottom:6}}>{r.note}</div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>onResolveExtension(uid,true)} style={{padding:"6px 12px",borderRadius:7,border:"none",background:B.green,color:"white",fontSize:11.5,cursor:"pointer"}}>Grant {EXTENSION_GRANT_DAYS} more days</button>
          <button onClick={()=>onResolveExtension(uid,false)} style={{padding:"6px 12px",borderRadius:7,border:`1px solid ${B.sage}`,background:"white",color:B.adminDark,fontSize:11.5,cursor:"pointer"}}>Decline</button>
        </div>
      </div>))}
    </div>}

    <div style={{background:"white",borderRadius:12,padding:"14px 15px",marginBottom:14,boxShadow:"0 2px 8px rgba(44,31,58,0.06)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <div><div style={{fontWeight:600,fontSize:14,color:B.adminDark}}>Course Status</div>
          <div style={{fontSize:11,color:B.purple,marginTop:2}}>{state==="active"?"Active — students are progressing through lessons":state==="window"?`Complete — ${daysLeft(meta)} days left in access window`:"Locked — access window has closed"}</div></div>

    </div>

    <div style={{background:"white",borderRadius:12,padding:"14px 15px",marginBottom:14,boxShadow:"0 2px 8px rgba(44,31,58,0.06)"}}>
      <div style={{fontWeight:600,fontSize:14,color:B.adminDark,marginBottom:8}}>Next Online Session</div>

  </div>);
};

// ── RECAP EDITOR ──
const RecapEditor=({recap,onSave})=>{
  const[items,setItems]=useState(recap?.items||[]);

  const[q,setQ]=useState("");const[a,setA]=useState("");

  const addItem=()=>{if(!q.trim()||!a.trim())return;setItems(p=>[...p,{q:q.trim(),a:a.trim()}]);setQ("");setA("");};
  const remItem=i=>setItems(p=>p.filter((_,idx)=>idx!==i));
  const save=async(publish)=>{setSaving(true);await onSave({items,released:publish!==undefined?publish:released});setSaving(false);setReleased(publish!==undefined?publish:released);setToast(publish?"Published to students ✓":"Saved ✓");};
  return(<div style={{padding:14,paddingBottom:80}}>
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}

      <textarea value={a} onChange={e=>setA(e.target.value)} placeholder="Answer…" style={{width:"100%",minHeight:70,padding:"9px 10px",borderRadius:9,border:`1.5px solid #C5BBCE`,fontSize:13,fontFamily:"'EB Garamond',serif",marginBottom:8,boxSizing:"border-box",resize:"vertical"}}/>

      <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:B.adminDark,marginBottom:3}}>{i+1}. {it.q}</div><div style={{fontSize:12,color:B.purple}}>{it.a}</div></div>

    <div style={{display:"flex",gap:10,marginTop:14}}>
      <button onClick={()=>save(false)} disabled={saving} style={{flex:1,padding:"12px",borderRadius:10,background:"white",border:`1px solid ${B.sage}`,color:B.adminDark,fontSize:13,cursor:"pointer"}}>Save Draft</button>
      <button onClick={()=>save(true)} disabled={saving} style={{flex:1,padding:"12px",borderRadius:10,background:B.green,border:"none",color:"white",fontSize:13,fontWeight:600,cursor:"pointer"}}>Publish to Students</button>

  </div>);

// ── RESPONSES TAB ──

const FeedbackWriter=({batchId,lesson,response,existingFb,onBack,onNavigate,hasPrev,hasNext,position})=>{
  const[overall,setOverall]=useState(existingFb?.overall||{stamp:null,note:"",resourceTitle:"",resourceUrl:""});

  const rfPs=lesson?.quiz?.reflections||[];
  const persist=async()=>saveFeedback(batchId,response.uid,response.lessonId,{overall,reflections:rFb,studentName:response.studentName,lessonId:response.lessonId,uid:response.uid,savedAt:new Date().toISOString()});
  const doSave=async()=>{setSaving(true);const ok=await persist();setSaving(false);setToast(ok?"Feedback saved ✓":"Save failed");if(ok)setTimeout(onBack,1200);};
  const doNavigate=async dir=>{
    // Auto-save whatever's been picked so far — even a lone stamp with no note — before switching students.

    onNavigate(dir);
  };
  const ta={width:"100%",padding:"9px 11px",borderRadius:9,border:`1.5px solid ${B.sage}`,fontSize:13,fontFamily:"'EB Garamond',serif",color:B.adminDark,background:"white",resize:"none",minHeight:60,lineHeight:1.6,marginBottom:8,boxSizing:"border-box"};
  return(<div style={{minHeight:"100vh",background:B.linen,display:"flex",flexDirection:"column"}}>
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    <AppHeader bg={B.adminDark} admin onBack={onBack} sub={COURSE_NAME}/>
    {(hasPrev||hasNext)&&<div style={{background:B.adminDark,padding:"9px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <button onClick={()=>doNavigate(-1)} disabled={!hasPrev} style={{background:"none",border:"none",color:hasPrev?"white":"rgba(255,255,255,0.3)",fontSize:20,cursor:hasPrev?"pointer":"default",padding:"0 8px"}}>‹</button>
      <span style={{color:"rgba(255,255,255,0.6)",fontSize:11}}>{position}</span>
      <button onClick={()=>doNavigate(1)} disabled={!hasNext} style={{background:"none",border:"none",color:hasNext?"white":"rgba(255,255,255,0.3)",fontSize:20,cursor:hasNext?"pointer":"default",padding:"0 8px"}}>›</button>
    </div>}

  </div>);
};

// ── STUDENT PROGRESS ──
const ProgressTab=({lessons,responses,whitelist})=>{
  const[exp,setExp]=useState(null);
  const rel=lessons.filter(l=>l.readingReleased).length;
  const students=whitelist||[];
  const Circle=({f})=>(<svg width="8" height="8" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill={f?"#A39C0F":"none"} stroke={f?"#A39C0F":"#C5BBCE"} strokeWidth="1.5"/></svg>);
  return(<div style={{padding:14,paddingBottom:80}}>
    <div style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:500,color:B.adminDark,marginBottom:4}}>Student Progress</div>
    <div style={{fontSize:9.5,color:B.purple,marginBottom:12}}>{students.length} students · {rel} of {lessons.length} lessons released</div>
    <div style={{background:"white",borderRadius:12,padding:"11px 13px",marginBottom:12,display:"flex",justifyContent:"space-around",boxShadow:"0 2px 8px rgba(44,31,58,0.06)"}}>
      {[{n:students.length,l:"Students",c:B.adminDark},{n:students.filter(s=>responses.filter(r=>r.studentName===s).length>=rel).length,l:"On Track",c:B.green},{n:students.filter(s=>{const c=responses.filter(r=>r.studentName===s).length;return c<rel&&c>0;}).length,l:"Pending",c:B.gold},{n:students.filter(s=>responses.filter(r=>r.studentName===s).length===0&&rel>0).length,l:"Behind",c:B.red}].map(s=>(<div key={s.l} style={{textAlign:"center"}}>
        <div style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:600,color:s.c,lineHeight:1}}>{s.n}</div>
        <div style={{fontSize:8,letterSpacing:1.5,textTransform:"uppercase",color:B.purple,marginTop:2}}>{s.l}</div>
      </div>))}
    </div>
    <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap",justifyContent:"center"}}>
      {[{c:"#A39C0F",l:"Reading"},{c:"#A39C0F",l:"Summary"},{c:"#A39C0F",l:"Quiz"},{c:"none",l:"Pending"}].map((x,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:4}}>
        <svg width="9" height="9" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill={x.c} stroke={x.c==="none"?"#C5BBCE":x.c} strokeWidth="1.5"/></svg>
        <span style={{fontSize:9,color:B.purple}}>{x.l}</span>
      </div>))}
    </div>
    {students.length===0&&<p style={{color:B.purple,fontSize:14,fontStyle:"italic",fontFamily:"'EB Garamond',serif"}}>No students registered yet.</p>}
    {students.map(name=>{
      const sub=responses.filter(r=>r.studentName===name);
      const done=sub.length;const avg=sub.length?Math.round((sub.reduce((a,r)=>a+(r.score||0),0)/sub.length)*10)/10:null;
      const pct=rel>0?Math.round((done/rel)*100):0;const isExp=exp===name;
      const streak=computeStreak(lessons,sub);
      const prog=lessons.map(l=>{const r=sub.find(x=>x.lessonId===l.id);return{reading:l.readingReleased,summary:l.summaryReleased,quiz:!!r,status:completionStatus(l,r)};});
      return(<div key={name} style={{background:"white",borderRadius:13,marginBottom:9,boxShadow:"0 2px 8px rgba(44,31,58,0.06)",overflow:"hidden"}}>
        <div onClick={()=>setExp(isExp?null:name)} style={{padding:"12px 13px",cursor:"pointer"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div style={{fontFamily:"'EB Garamond',serif",fontSize:16,fontWeight:600,color:B.adminDark}}>{name}</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {streak>0&&<span style={{background:"#F5F4E1",color:B.green,borderRadius:8,padding:"2px 8px",fontSize:9.5,fontWeight:600}}>🔥 {streak}</span>}
              {avg&&<span style={{background:"#fdf3d0",color:"#8a6800",borderRadius:8,padding:"2px 8px",fontSize:9.5,fontWeight:600}}>Avg {avg}/10</span>}
              <span style={{color:"#C5BBCE",fontSize:13,display:"inline-block",transform:isExp?"rotate(90deg)":"none",transition:"transform 0.2s"}}>›</span>
            </div>
          </div>
          <div style={{height:4,background:"#f0ede8",borderRadius:4,marginBottom:4}}><div style={{height:4,borderRadius:4,background:`linear-gradient(to right,${B.green},${B.gold})`,width:`${pct}%`}}/></div>
          <div style={{fontSize:9,color:B.purple}}>{done} / {rel} lessons · quiz submitted</div>
        </div>
        {isExp&&<div style={{padding:"0 13px 12px",borderTop:"1px solid #f0ede8"}}>
          <div style={{fontSize:8.5,letterSpacing:2,textTransform:"uppercase",color:B.purple,fontWeight:600,padding:"9px 0 7px",textAlign:"center"}}>Lesson by Lesson — All {lessons.length}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,justifyContent:"center"}}>
            {prog.map((p,i)=>(<div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <div style={{fontSize:7.5,color:"#8A7099"}}>{`L${i+1}`}</div>
              <div style={{display:"flex",gap:2}}><Circle f={p.reading}/><Circle f={p.summary}/><Circle f={p.quiz}/></div>
            </div>))}
          </div>
        </div>}
      </div>);
    })}
  </div>);
};

// ── ADMIN DASHBOARD ──
const AdminDashboard=({batchId,batchMeta,lessons,responses,feedback,whitelist,recap,extensionRequests,onSaveLesson,onSaveWhitelist,onMarkComplete,onSetNextSession,onResolveExtension,onSaveRecap,onRefresh,onBackToBatches})=>{
  const[tab,setTab]=useState("lessons");const[editing,setEditing]=useState(null);
  const[openResp,setOpenResp]=useState(null);const[openList,setOpenList]=useState([]);const[openIdx,setOpenIdx]=useState(0);
  responses=(responses||[]).filter(Boolean);feedback=(feedback||[]).filter(Boolean);
  if(editing){const cur=lessons.find(l=>l.id===editing.id)||editing;return<LessonEdit lesson={cur} onSave={async upd=>{const ok=await onSaveLesson(upd);setEditing(upd);return ok;}} onBack={()=>{setEditing(null);onRefresh();}}/>;}
  if(openResp){
    const l=lessons.find(x=>x.id===openResp.lessonId);
    const fb=feedback.find(f=>f.lessonId===openResp.lessonId&&f.studentName===openResp.studentName);
    const goto=idx=>{if(idx<0||idx>=openList.length)return;setOpenResp(openList[idx]);setOpenIdx(idx);};
    return<FeedbackWriter batchId={batchId} key={`${openResp.uid}_${openResp.lessonId}`} lesson={l} response={openResp} existingFb={fb} onBack={()=>{setOpenResp(null);onRefresh();}} onNavigate={dir=>goto(openIdx+dir)} hasPrev={openIdx>0} hasNext={openIdx<openList.length-1} position={`${openIdx+1} of ${openList.length}`}/>;
  }
  const requestCount=Object.keys(extensionRequests||{}).length;
  const adminTabs=[{id:"lessons",label:"Lessons",icon:<IBook/>},{id:"responses",label:"Responses",icon:<IDoc/>},{id:"progress",label:"Progress",icon:<IPeople/>}];
  return(<div style={{minHeight:"100vh",background:B.linen,display:"flex",flexDirection:"column"}}>
    <AppHeader bg={B.adminDark} admin sub={`${batchMeta?.name||""}`} onBack={onBackToBatches}/>
    <div style={{flex:1,overflow:"auto"}}>
      {tab==="lessons"&&<div style={{padding:14,paddingBottom:80}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontFamily:"'EB Garamond',serif",fontSize:20,fontWeight:500,color:B.adminDark}}>All Lessons</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setTab("recap")} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${B.sage}`,background:"white",color:B.purple,fontSize:11,cursor:"pointer"}}>Recap</button>
            <button onClick={()=>setTab("settings")} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${B.sage}`,background:requestCount>0?"#FBEDED":"white",color:requestCount>0?"#a55":B.purple,fontSize:11,cursor:"pointer"}}>⚙ Settings{requestCount>0?` (${requestCount})`:""}</button>
            <button onClick={onRefresh} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${B.sage}`,background:"white",color:B.purple,fontSize:11,cursor:"pointer"}}>↻</button>
          </div>
        </div>
        {["Released","Reading Live","Scheduled","Draft"].map(grp=>{
          const ls=lessons.filter(l=>lessonStatus(l)===grp);if(ls.length===0)return null;
          return(<div key={grp}><div style={{fontSize:8.5,letterSpacing:2.5,textTransform:"uppercase",color:B.purple,fontWeight:600,margin:"14px 0 8px"}}>{grp}</div>
            {ls.map(l=>(<div key={l.id} onClick={()=>setEditing(l)} style={{background:"white",borderRadius:12,padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",boxShadow:"0 2px 8px rgba(44,31,58,0.07)"}}>
              <div style={{flex:1,minWidth:0,marginRight:10}}>
                <div style={{fontWeight:600,fontSize:15,color:B.adminDark,fontFamily:"'EB Garamond',serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{l.lessonNumber}. {l.title}</div>
                <div style={{fontSize:10,color:B.purple,marginTop:2}}>{l.readingReleased?`Released ${l.readingReleaseDate||""}`:l.readingScheduledDate?`Scheduled ${fmtDate(l.readingScheduledDate)}`:"Not yet scheduled"}{l.dueAt?` · Due ${fmtDT(l.dueAt)}`:""}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}><Badge status={lessonStatus(l)}/><span style={{color:"#C5BBCE",fontSize:14}}>›</span></div>
            </div>))}
          </div>);
        })}
      </div>}
      {tab==="responses"&&<ResponsesTab lessons={lessons} responses={responses} feedback={feedback} onOpen={(r,list,i)=>{setOpenResp(r);setOpenList(list);setOpenIdx(i);}}/>}
      {tab==="progress"&&<ProgressTab lessons={lessons} responses={responses} whitelist={whitelist}/>}
      {tab==="recap"&&<><button onClick={()=>setTab("lessons")} style={{margin:"14px 0 0 14px",padding:"6px 12px",borderRadius:8,border:`1px solid ${B.sage}`,background:"white",color:B.purple,fontSize:11,cursor:"pointer"}}>← Lessons</button><RecapEditor recap={recap} onSave={onSaveRecap}/></>}
      {tab==="settings"&&<><button onClick={()=>setTab("lessons")} style={{margin:"14px 0 0 14px",padding:"6px 12px",borderRadius:8,border:`1px solid ${B.sage}`,background:"white",color:B.purple,fontSize:11,cursor:"pointer"}}>← Lessons</button><AdminSettings batchId={batchId} meta={batchMeta} whitelist={whitelist} extensionRequests={extensionRequests} onSaveWhitelist={onSaveWhitelist} onMarkComplete={onMarkComplete} onSetNextSession={onSetNextSession} onResolveExtension={onResolveExtension}/></>}
    </div>
    {tab!=="settings"&&tab!=="recap"&&<BottomNav tabs={adminTabs} active={tab} onSelect={setTab} bg={B.adminDark} ac={B.gold}/>}
  </div>);
};

// ── LESSON VIEW (Student) ──
const LessonView=({lesson,studentName,responses,feedback,onSubmitQuiz,readOnly=false})=>{
  const existing=responses.find(r=>r.lessonId===lesson.id&&r.studentName===studentName);
  const[mcA,setMcA]=useState(existing?.mcAnswers||[]);
  const[reflT,setReflT]=useState(existing?.reflections||(lesson.quiz?.reflections||[]).map(()=>""));
  const[submitted,setSubmitted]=useState(!!existing);
  const[submitting,setSubmitting]=useState(false);
  const[showAllQ,setShowAllQ]=useState(false);const[showAllR,setShowAllR]=useState(false);
  const mcQs=lesson.quiz?.mcQuestions||[];const rfPs=lesson.quiz?.reflections||[];
  const score=submitted?mcQs.reduce((s,q,i)=>s+(mcA[i]===q.correct?1:0),0):null;
  const myFb=feedback.find(f=>f.lessonId===lesson.id&&f.studentName===studentName);
  const showSum=readOnly||lesson.summaryReleased;const showQ=readOnly||lesson.quizReleased;
  const submit=async()=>{if(mcQs.length>0&&mcA.length<mcQs.length){alert("Please answer all questions.");return;}setSubmitting(true);const sc=mcQs.reduce((s,q,i)=>s+(mcA[i]===q.correct?1:0),0);await onSubmitQuiz({lessonId:lesson.id,studentName,submittedAt:new Date().toISOString(),mcAnswers:mcA,score:sc,reflections:reflT});setSubmitting(false);setSubmitted(true);};
  const RP=({i,q})=>{const sel=mcA[i]??null;const opts=q.options.map((opt,j)=>{const iC=j===q.correct,iS=j===sel;let bg="white",border=`1px solid ${B.sage}`;if(submitted){if(iC){bg="#f0faf0";border=`1px solid #A39C0F30`;}if(iS&&!iC){bg="#fff0f0";border=`1px solid #C0392B25`;}}else if(iS){bg="rgba(163,156,15,0.1)";border=`1px solid ${B.green}`;}
    return(<div key={j} onClick={()=>{if(!submitted&&!readOnly){const a=[...mcA];a[i]=j;setMcA(a);}}} style={{display:"flex",alignItems:"center",gap:7,borderRadius:8,padding:"7px 10px",marginBottom:4,border,background:bg,cursor:submitted||readOnly?"default":"pointer"}}>
      {submitted?(iC?<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#A39C0F" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>:iS?<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#C0392B" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>:<div style={{width:10,height:10,borderRadius:"50%",border:"1.5px solid #C5BBCE",flexShrink:0}}/>):<div style={{width:10,height:10,borderRadius:"50%",border:`1.5px solid ${iS?B.green:"#C5BBCE"}`,background:iS?"rgba(163,156,15,0.3)":"none",flexShrink:0}}/>}
      <span style={{fontFamily:"'EB Garamond',serif",fontSize:13.5,fontWeight:submitted&&iC?600:400,color:submitted&&iS&&!iC?"#C0392B":submitted&&iC?B.darkPurple:"#5B4969"}}>{opt}</span>
      {submitted&&iS&&!iC&&<span style={{fontSize:8,color:"#C0392B",marginLeft:2}}>your answer</span>}
    </div>);});
    return(<div style={{marginBottom:12}}><div style={{fontSize:12,color:B.darkPurple,fontWeight:500,marginBottom:6,lineHeight:1.4}}>{i+1}. {q.question}</div>{opts}</div>);};

  return(<div style={{padding:"18px 16px 40px",fontFamily:"'EB Garamond',serif"}} className="fade-in">
    {myFb&&<div style={{background:`linear-gradient(135deg,${B.darkPurple},#7B6B8A)`,borderRadius:12,padding:"11px 13px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center",gap:9,textAlign:"center"}}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div><div style={{fontSize:11,fontWeight:600,color:"white",marginBottom:2}}>Your teacher has left feedback</div><div style={{fontSize:10,color:"rgba(255,255,255,0.65)"}}>Lesson {lesson.lessonNumber} — {lesson.title}</div></div>
    </div>}
    <SL c={`Lesson ${lesson.lessonNumber} · Pre-Class Reading`}/>
    <h1 style={{fontSize:32,color:"#8B5A2B",fontWeight:600,margin:"0 0 16px",lineHeight:1.2}}>{lesson.title}</h1>
    {lesson.reading?<div className="prose-reading prose-reading-body" dangerouslySetInnerHTML={{__html:sanitizeLessonHtml(lesson.reading)}}/>:<p style={{color:B.sage,fontStyle:"italic",fontSize:16}}>Reading not yet available.</p>}
    <Div/><SL c="Session Summary"/>
    {showSum?lesson.summary?<div style={{background:"rgba(163,156,15,0.07)",borderRadius:12,padding:"16px 18px",border:`1px solid ${B.sage}30`}}><div className="prose-reading prose-reading-summary" dangerouslySetInnerHTML={{__html:sanitizeLessonHtml(lesson.summary)}}/></div>:<p style={{color:B.sage,fontStyle:"italic",fontSize:15}}>Summary not yet available.</p>
      :<div style={{background:"rgba(138,112,153,0.07)",borderRadius:12,padding:"16px 18px",border:`1px dashed ${B.sage}`,textAlign:"center"}}><p style={{color:B.purple,fontSize:16,fontStyle:"italic"}}>The session summary will appear here after class.</p><button style={{width:"100%",marginTop:10,padding:"11px",borderRadius:10,background:B.darkPurple,color:"white",border:"none",fontSize:12,fontWeight:400,opacity:0.55,cursor:"default",letterSpacing:0.6}}>Available After Class</button></div>}
    <Div/><SL c="Quiz & Reflections"/>
    {showQ?(submitted?(<>
      <div style={{background:`linear-gradient(135deg,${B.darkPurple},#7B6B8A)`,borderRadius:14,padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div><div style={{fontFamily:"'EB Garamond',serif",fontSize:26,fontWeight:500,color:"white",lineHeight:1}}>{score}/{mcQs.length}</div><div style={{fontSize:8.5,letterSpacing:2,textTransform:"uppercase",color:"rgba(255,255,255,0.5)",marginTop:3}}>Quiz Score</div></div>
        <div style={{textAlign:"right"}}><div style={{fontSize:11,color:"rgba(255,255,255,0.65)",marginBottom:4}}><span style={{color:"#d4af37",fontWeight:600}}>{score} correct</span></div><div style={{fontSize:11,color:"rgba(255,255,255,0.65)"}}><span style={{color:"#f4a58a",fontWeight:600}}>{mcQs.length-score} incorrect</span></div></div>
      </div>
      {myFb?.overall?.stamp&&<div style={{background:"white",borderRadius:11,padding:"12px 13px",marginBottom:12,borderLeft:`3px solid ${B.metalGold}`,boxShadow:"0 2px 8px rgba(91,73,105,0.07)"}}>
        <div style={{fontSize:8.5,letterSpacing:1.5,textTransform:"uppercase",color:B.purple,fontWeight:600,marginBottom:7}}>From your teacher</div>
        <StampShow stampId={myFb.overall.stamp}/>
        {myFb.overall.note&&<div style={{fontFamily:"'EB Garamond',serif",fontSize:14,color:B.adminDark,lineHeight:1.7,marginBottom:6}}>{myFb.overall.note}</div>}
        {myFb.overall.resourceTitle&&<div style={{background:"#f7f5f2",borderRadius:8,padding:"8px 10px",display:"flex",alignItems:"center",gap:7}}>
          <IBook stroke={B.green} size={13}/><span style={{fontSize:11,color:B.darkPurple,flex:1}}>{myFb.overall.resourceTitle}</span>
          {myFb.overall.resourceUrl&&<a href={myFb.overall.resourceUrl} target="_blank" rel="noopener noreferrer" style={{fontSize:10,color:B.green,fontWeight:600,textDecoration:"none"}}>Open ↗</a>}
        </div>}
      </div>}

// Reminder banner logic — driven by real data (due dates, next session), not a fixed calendar.
const ReminderBanner=({latest,myResp,batchMeta})=>{
  const submitted=latest?myResp.some(r=>r.lessonId===latest.id):false;
  const dueAt=latest?.dueAt?new Date(latest.dueAt):null;
  const hoursLeft=dueAt?(dueAt.getTime()-Date.now())/3600000:null;
  let state=null;
  if(latest&&!submitted&&hoursLeft!==null&&hoursLeft<=24&&hoursLeft>-100000){
    state={Icon:IconQuizDue,color:"#C97B7B",bg:"#FBEDED",title:"Submit your quiz tonight",body:"Submit your quiz and reflection before the deadline to keep your streak going."};
  }else if(latest&&!submitted&&latest.readingReleaseDate){
    const releasedRecently=(Date.now()-new Date(latest.readingReleaseDate.split(" ").length>1?latest.readingReleaseDate:Date.now()).getTime())<86400000;
    state=releasedRecently?
      {Icon:IconNotebook,color:B.purple,bg:"#F6EFF3",title:"Today Session's materials are up",body:"Lesson notes, quiz, and reflection questions are ready whenever you are."}:
      {Icon:IconNotebook,color:B.gold,bg:"#FBF3DC",title:"Time to read",body:"Take a little time this week to sit with the reading before the quiz is due."};
  }else if(batchMeta?.nextSessionAt){
    const d=new Date(batchMeta.nextSessionAt);
    state={Icon:IconOnlineSession,color:B.green,bg:"#F5F4E1",title:`Next online session: ${fmtDT(batchMeta.nextSessionAt)}`,body:"This week's pre-reading is now available — a gentle place to begin before we meet."};
  }
  if(!state)return null;
  const{Icon}=state;
  return(<div style={{background:state.bg,borderRadius:14,padding:"14px 15px",display:"flex",gap:12,margin:"14px 14px 0",alignItems:"flex-start"}}>
    <div style={{width:38,height:38,borderRadius:"50%",background:B.purple,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon color="white" size={18}/></div>
    <div style={{flex:1}}><div style={{fontSize:13.5,fontWeight:600,color:B.darkPurple,marginBottom:2,fontFamily:"'EB Garamond',serif"}}>{state.title}</div><div style={{fontSize:11.5,color:B.purple,lineHeight:1.5}}>{state.body}</div></div>
  </div>);
};

const JournalTab=({lessons,journal,onSave})=>{
  const released=lessons.filter(l=>l.readingReleased).sort((a,b)=>a.lessonNumber-b.lessonNumber);
  const[selected,setSelected]=useState(released[0]?.id||null);
  const draft=journal[selected]||{text:"",images:[]};

                <span style={{fontFamily:"'EB Garamond',serif",fontSize:12.5,fontWeight:iC?600:400,color:iS&&!iC?"#C0392B":iC?B.darkPurple:"#b5adc0"}}>{opt}</span>
                {iS&&!iC&&<span style={{fontSize:8,color:"#C0392B",marginLeft:2}}>your answer</span>}

            </div>);})}

            <div style={{fontSize:10,fontWeight:700,letterSpacing:2.5,textTransform:"uppercase",color:B.darkPurple,marginBottom:10}}>REFLECTIONS</div>
            {(srAll?rfPs:rfPs.slice(0,1)).map((prompt,i)=>{const fb=myFb?.reflections?.[i];return(<div key={i} style={{marginBottom:12}}>
              <div style={{fontFamily:"'EB Garamond',serif",fontStyle:"italic",fontSize:13.5,color:B.purple,lineHeight:1.55,marginBottom:6}} dangerouslySetInnerHTML={{__html:sanitizeLessonHtml(prompt)}}/>
              <div style={{fontFamily:"'EB Garamond',serif",fontSize:15,color:B.adminDark,lineHeight:1.7,padding:"10px 12px",background:"#F7F4F0",borderRadius:10,marginBottom:fb?.stamp?8:0}}>{r.reflections?.[i]||<em style={{color:B.sage}}>No response.</em>}</div>
              {fb?.stamp&&<div style={{background:"white",borderRadius:10,padding:"10px 12px",borderLeft:`3px solid ${B.metalGold}`,marginTop:6}}>
                <div style={{fontSize:8.5,letterSpacing:1.5,textTransform:"uppercase",color:B.purple,fontWeight:600,marginBottom:6}}>From your teacher</div>

          </div>);

};

// ── WELCOME + PIN ──
const WelcomeScreen=({batchIndex,activeBatchId,onEnter})=>{
  const[step,setStep]=useState("name");
  const[first,setFirst]=useState("");const[surname,setSurname]=useState("");
  const[pin,setPin]=useState("");const[confirm,setConfirm]=useState("");
  const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const[foundBatchId,setFoundBatchId]=useState(null);
  const[lockedMeta,setLockedMeta]=useState(null);
  const[reqNote,setReqNote]=useState("");const[reqSent,setReqSent]=useState(false);
  const full=`${first.trim()} ${surname.trim()}`.trim();const ready=first.trim()&&surname.trim();
  const key=keyOf(full);
  const inp={width:"100%",padding:"13px 14px",borderRadius:10,border:`1px solid ${B.sage}`,fontSize:16,fontFamily:"'EB Garamond',serif",boxSizing:"border-box",background:"white",marginBottom:11,outline:"none"};

  const findExistingBatch=async()=>{
    const ids=Object.keys(batchIndex||{});
    const checks=await Promise.all(ids.map(async id=>{
      const reg=await rtGet(bp(id,`registeredNames/${key}`));
      return reg?{batchId:id,reg}:null;
    }));
    return checks.find(Boolean)||null;
  };

  const handleName=async()=>{if(!ready)return;setLoading(true);setErr("");
    const existing=await findExistingBatch();
    if(existing){setFoundBatchId(existing.batchId);setStep("returning");setLoading(false);return;}
    if(!activeBatchId){setErr("There is no course currently open for new registration. Please check with your teacher.");setLoading(false);return;}
    const wl=await rtGet(bp(activeBatchId,"whitelist"))||[];
    const onList=wl.some(n=>n.toLowerCase()===full.toLowerCase());
    if(!onList){setErr("Your name is not on the approved list. Please check with your teacher.");setLoading(false);return;}
    setErr("");setStep("pin");setLoading(false);};

  const handlePin=async()=>{
    if(pin.length!==4||!/^\d{4}$/.test(pin)){setErr("Please enter a 4-digit PIN.");return;}
    if(pin!==confirm){setErr("PINs do not match.");return;}
    setLoading(true);setErr("");
    try{
      const d=await authSignUp(pseudoEmail(activeBatchId,key),derivePassword(pin));
      setSession(d);
      await registerName(activeBatchId,key,d.localId);
      setLoading(false);onEnter(full,activeBatchId,d.localId);
    }catch(e){
      setLoading(false);
      if(String(e.message).includes("EMAIL_EXISTS")){setErr("This name is already registered. Please go back and use 'Not you?' to sign in instead.");}
      else{setErr("Could not set up your account. Please check your connection and try again.");}
    }};

  const handleReturn=async()=>{
    setLoading(true);setErr("");
    try{
      const d=await authSignIn(pseudoEmail(foundBatchId,key),derivePassword(pin));
      setSession(d);
      const[meta,reg]=await Promise.all([loadBatchMeta(foundBatchId),rtGet(bp(foundBatchId,`registeredNames/${key}`))]);
      if(!studentAccessAllowed(meta,reg)){setLockedMeta(meta);setStep("locked");setLoading(false);return;}
      setLoading(false);onEnter(full,foundBatchId,d.localId,meta);
    }catch(e){
      setLoading(false);
      setErr("Incorrect PIN.");
    }};

  const sendExtensionRequest=async()=>{
    setLoading(true);
    await submitExtensionRequest(foundBatchId,session.uid,full,reqNote||"Requesting continued access.");
    setLoading(false);setReqSent(true);
  };

  return(<div style={{minHeight:"100vh",background:B.linen,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
    <div style={{width:"100%",maxWidth:390,background:"white",borderRadius:20,padding:30,boxShadow:"0 4px 22px rgba(91,73,105,0.11)",textAlign:"center"}}>
      <div style={{display:"flex",justifyContent:"center",marginBottom:14}}><LotusImg size={56} float/></div>
      <div style={{fontFamily:"'EB Garamond',serif",fontSize:18,fontWeight:600,color:B.darkPurple,marginBottom:12,lineHeight:1.2}}>Yoga Vana Forest Academy</div>
      {step==="name"&&<>
        <h2 style={{color:B.darkPurple,fontSize:24,margin:"0 0 8px",fontFamily:"'EB Garamond',serif",fontWeight:500,fontStyle:"italic"}}>namaste !</h2>
        <div style={{width:36,height:1.5,background:`linear-gradient(to right,transparent,${B.gold},transparent)`,margin:"10px auto 18px"}}/>
        <p style={{color:B.purple,fontSize:16,marginBottom:24,lineHeight:1.65,fontFamily:"'EB Garamond',serif"}}>Please enter your name so your teacher can recognise your work.</p>
        <input value={first} onChange={e=>setFirst(e.target.value)} placeholder="First name…" style={inp}/>
        <input value={surname} onChange={e=>setSurname(e.target.value)} placeholder="Surname…" onKeyDown={e=>e.key==="Enter"&&ready&&handleName()} style={{...inp,marginBottom:0}}/>
        {err&&<div style={{color:B.red,fontSize:12,marginTop:8,textAlign:"center"}}>{err}</div>}
        <button onClick={handleName} disabled={!ready||loading} style={{width:"100%",marginTop:18,padding:"14px",borderRadius:12,background:ready?B.darkPurple:"#c5bfa8",color:"white",border:"none",fontSize:14,fontFamily:"DM Sans,sans-serif",fontWeight:400,letterSpacing:"0.6px",cursor:ready?"pointer":"default"}}>{loading?"Checking…":"Continue"}</button>
      </>}
      {step==="pin"&&<>
        <h2 style={{color:B.darkPurple,fontSize:22,margin:"0 0 8px",fontFamily:"'EB Garamond',serif",fontWeight:500}}>Create your PIN</h2>
        <div style={{width:36,height:1.5,background:`linear-gradient(to right,transparent,${B.gold},transparent)`,margin:"10px auto 18px"}}/>
        <p style={{color:B.purple,fontSize:15,marginBottom:24,lineHeight:1.65,fontFamily:"'EB Garamond',serif"}}>Choose a 4-digit PIN only you know. You will use it every time you log in.</p>
        <input type="password" inputMode="numeric" maxLength={4} value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,""))} placeholder="4-digit PIN" style={{...inp,textAlign:"center",letterSpacing:8,fontSize:20}}/>
        <input type="password" inputMode="numeric" maxLength={4} value={confirm} onChange={e=>setConfirm(e.target.value.replace(/\D/g,""))} placeholder="Confirm PIN" style={{...inp,textAlign:"center",letterSpacing:8,fontSize:20,marginBottom:0}}/>
        {err&&<div style={{color:B.red,fontSize:12,marginTop:8,textAlign:"center"}}>{err}</div>}
        <button onClick={handlePin} disabled={loading} style={{width:"100%",marginTop:18,padding:"14px",borderRadius:12,background:B.darkPurple,color:"white",border:"none",fontSize:14,fontFamily:"DM Sans,sans-serif",fontWeight:400,letterSpacing:"0.6px",cursor:"pointer"}}>{loading?"Setting up…":"Step Into Your Practice"}</button>
      </>}
      {step==="returning"&&<>
        <h2 style={{color:B.darkPurple,fontSize:22,margin:"0 0 8px",fontFamily:"'EB Garamond',serif",fontWeight:500}}>Welcome back</h2>
        <div style={{width:36,height:1.5,background:`linear-gradient(to right,transparent,${B.gold},transparent)`,margin:"10px auto 18px"}}/>
        <p style={{color:B.purple,fontSize:15,marginBottom:6,lineHeight:1.65,fontFamily:"'EB Garamond',serif",fontStyle:"italic"}}>{full}</p>
        <p style={{color:B.purple,fontSize:14,marginBottom:18,lineHeight:1.65,fontFamily:"'EB Garamond',serif"}}>Enter your PIN to continue.</p>
        <input type="password" inputMode="numeric" maxLength={4} value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,""))} onKeyDown={e=>e.key==="Enter"&&handleReturn()} placeholder="Your PIN" style={{...inp,textAlign:"center",letterSpacing:8,fontSize:20,marginBottom:0}}/>
        {err&&<div style={{color:B.red,fontSize:12,marginTop:8,textAlign:"center"}}>{err}</div>}
        <button onClick={handleReturn} disabled={loading} style={{width:"100%",marginTop:18,padding:"14px",borderRadius:12,background:B.darkPurple,color:"white",border:"none",fontSize:14,fontFamily:"DM Sans,sans-serif",fontWeight:400,letterSpacing:"0.6px",cursor:"pointer"}}>{loading?"Checking…":"Step Into Your Practice"}</button>
        <button onClick={()=>{setStep("name");setFirst("");setSurname("");setPin("");setErr("");}} style={{width:"100%",marginTop:10,padding:"10px",borderRadius:12,background:"none",color:B.purple,border:`1px solid #C5BBCE`,fontSize:13,cursor:"pointer"}}>Not you? Go back</button>
      </>}
      {step==="locked"&&<>
        <div style={{display:"flex",justifyContent:"center",marginBottom:6}}><div style={{width:60,height:60,borderRadius:"50%",background:B.purple,display:"flex",alignItems:"center",justifyContent:"center"}}><IconGate color="white" size={30}/></div></div>
        <h2 style={{color:B.darkPurple,fontSize:20,margin:"14px 0 8px",fontFamily:"'EB Garamond',serif",fontWeight:500}}>Your access period has ended</h2>
        <p style={{color:B.purple,fontSize:13.5,marginBottom:18,lineHeight:1.65,fontFamily:"'EB Garamond',serif"}}>This batch's login window has closed. Your reflections and progress are still safely kept — if you'd like continued access, you can request it below.</p>
        {!reqSent?<>
          <textarea value={reqNote} onChange={e=>setReqNote(e.target.value)} placeholder="Optional note to your teacher…" style={{...inp,minHeight:70,resize:"vertical"}}/>
          <button onClick={sendExtensionRequest} disabled={loading} style={{width:"100%",marginTop:8,padding:"13px",borderRadius:12,background:B.purple,color:"white",border:"none",fontSize:13.5,fontFamily:"DM Sans,sans-serif",cursor:"pointer"}}>{loading?"Sending…":"Request extended access"}</button>
        </>:<div style={{color:B.sage,fontSize:13.5,fontWeight:600}}>Request sent — your teacher will be in touch.</div>}
        <button onClick={()=>{setStep("name");setFirst("");setSurname("");setPin("");setErr("");setReqSent(false);}} style={{width:"100%",marginTop:14,padding:"10px",borderRadius:12,background:"none",color:B.purple,border:`1px solid #C5BBCE`,fontSize:13,cursor:"pointer"}}>Go back</button>
      </>}
      <div style={{marginTop:26}}><CurvedLogo width={140} opacity={0.48}/></div>
    </div>
  </div>);
};

const slugify=s=>s.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||`batch-${Date.now()}`;
const AdminBatches=({batchIndex,onSelect,onCreated,onRefresh})=>{
  const[showForm,setShowForm]=useState(false);
  const[form,setForm]=useState({name:"",start:"",lessons:"",whitelist:""});
  const[creating,setCreating]=useState(false);const[toast,setToast]=useState(null);
  const entries=Object.entries(batchIndex||{}).sort((a,b)=>(b[1].order||0)-(a[1].order||0));
  const create=async()=>{
    if(!form.name.trim())return;
    setCreating(true);
    const id=slugify(form.name);
    const names=form.whitelist.split("\n").map(n=>n.trim()).filter(Boolean);
    const meta={name:form.name.trim(),status:"active",started:form.start||todayISO(),lessonCount:Math.min(20,Number(form.lessons)||20),order:Date.now()};
    await saveBatchMeta(id,meta);
    await saveWhitelist(id,names);
    setCreating(false);setShowForm(false);setForm({name:"",start:"",lessons:"",whitelist:""});
    setToast(`${meta.name} created`);
    onCreated&&onCreated(id);
  };
  return(<div style={{padding:14,paddingBottom:40,maxWidth:520,margin:"0 auto"}}>
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div style={{fontFamily:"'EB Garamond',serif",fontSize:22,fontWeight:500,color:B.adminDark}}>Batches</div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onRefresh} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${B.sage}`,background:"white",color:B.purple,fontSize:11,cursor:"pointer"}}>↻</button>
        <button onClick={()=>setShowForm(true)} style={{display:"flex",alignItems:"center",gap:5,padding:"7px 13px",borderRadius:9,border:"none",background:B.adminDark,color:"white",fontSize:12,cursor:"pointer"}}><IconPlus size={12}/>New Batch</button>
      </div>
    </div>
    {showForm&&<div style={{background:"white",borderRadius:14,padding:"16px 18px",marginBottom:16,boxShadow:"0 4px 16px rgba(44,31,58,0.1)"}}>
      <div style={{fontSize:15,fontWeight:600,color:B.adminDark,marginBottom:12}}>Create New Batch</div>
      <label style={{fontSize:11.5,color:B.purple}}>Batch name</label>
      <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. BYC 2026-B" style={{width:"100%",padding:"9px 11px",borderRadius:8,border:`1.5px solid #C5BBCE`,marginTop:4,marginBottom:12,fontFamily:"'EB Garamond',serif",fontSize:13,boxSizing:"border-box"}}/>
      <div style={{display:"flex",gap:10}}>
        <div style={{flex:1}}>
          <label style={{fontSize:11.5,color:B.purple}}>Start date</label>
          <input type="date" value={form.start} onChange={e=>setForm(f=>({...f,start:e.target.value}))} style={{width:"100%",padding:"9px 11px",borderRadius:8,border:`1.5px solid #C5BBCE`,marginTop:4,marginBottom:12,fontFamily:"'EB Garamond',serif",fontSize:13,boxSizing:"border-box"}}/>
        </div>
        <div style={{flex:1}}>
          <label style={{fontSize:11.5,color:B.purple}}>Expected lesson count</label>
          <input type="number" min="1" max="20" value={form.lessons} onChange={e=>setForm(f=>({...f,lessons:e.target.value}))} placeholder="e.g. 15 (max 20)" style={{width:"100%",padding:"9px 11px",borderRadius:8,border:`1.5px solid #C5BBCE`,marginTop:4,marginBottom:12,fontFamily:"'EB Garamond',serif",fontSize:13,boxSizing:"border-box"}}/>
        </div>
      </div>
      <label style={{fontSize:11.5,color:B.purple}}>Student whitelist (one name per line)</label>
      <textarea value={form.whitelist} onChange={e=>setForm(f=>({...f,whitelist:e.target.value}))} placeholder={"Priya Sharma\nMeera Iyer"} style={{width:"100%",minHeight:90,padding:"9px 11px",borderRadius:8,border:`1.5px solid #C5BBCE`,marginTop:4,marginBottom:16,fontFamily:"'EB Garamond',serif",fontSize:13,boxSizing:"border-box",resize:"vertical"}}/>
      <div style={{display:"flex",gap:10}}>
        <button onClick={create} disabled={creating} style={{padding:"10px 18px",borderRadius:8,border:"none",background:B.green,color:"white",fontSize:13,fontWeight:600,cursor:"pointer"}}>{creating?"Creating…":"Create Batch"}</button>
        <button onClick={()=>setShowForm(false)} style={{padding:"10px 18px",borderRadius:8,border:`1px solid ${B.sage}`,background:"white",color:B.adminDark,fontSize:13,cursor:"pointer"}}>Cancel</button>
      </div>
    </div>}
    {entries.length===0&&<p style={{color:B.purple,fontSize:14,fontStyle:"italic",fontFamily:"'EB Garamond',serif"}}>No batches yet — create your first one above.</p>}
    {entries.map(([id,e])=>(<div key={id} onClick={()=>onSelect(id)} style={{background:"white",borderRadius:12,padding:"13px 15px",marginBottom:8,cursor:"pointer",boxShadow:"0 2px 8px rgba(44,31,58,0.07)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{fontFamily:"'EB Garamond',serif",fontSize:16,fontWeight:600,color:B.adminDark}}>{e.name}</div>
      <span style={{fontSize:10.5,padding:"3px 10px",borderRadius:20,background:e.status==="active"?"#F5F4E1":e.status==="window"?"#FBF3DC":"#F1EAF0",color:e.status==="active"?B.green:e.status==="window"?"#B08B1F":B.purple}}>{e.status==="active"?"Active":e.status==="window"?"In access window":"Locked"}</span>
    </div>))}
  </div>);
};
// ── ROOT ──
function App(){
  const[role,setRole]=useState(null); // null|welcome|student|admin
  const[student,setStudent]=useState(null);const[uid,setUid]=useState(null);
  const[batchId,setBatchId]=useState(null);const[batchMeta,setBatchMeta]=useState(null);
  const[batchIndex,setBatchIndex]=useState({});
  const[lessons,setLessons]=useState(null);const[responses,setResponses]=useState([]);
  const[feedback,setFeedback]=useState([]);const[journal,setJournal]=useState({});const[badges,setBadges]=useState({});
  const[recap,setRecap]=useState(null);const[newBadge,setNewBadge]=useState(false);
  const[whitelist,setWhitelist]=useState([]);const[extensionRequests,setExtensionRequests]=useState({});
  const[adminView,setAdminView]=useState("batches"); // batches|dashboard
  const[loading,setLoading]=useState(true);const[error,setError]=useState(null);

  const activeBatchId=Object.entries(batchIndex).find(([,e])=>e.status==="active")?.[0]||null;

  // Public: safe to load before anyone signs in (needed for the welcome screen's batch lookup).
  const loadPublic=useCallback(async()=>{setLoading(true);setError(null);try{setBatchIndex(await loadBatchIndex());}catch(e){setError("Could not connect to Firebase. Please check your internet connection.");}finally{setLoading(false);}},[]);
  useEffect(()=>{loadPublic();},[]);

  // Runs once a student is signed in — only ever fetches THEIR OWN data, scoped to their batch.
  const loadStudentData=useCallback(async(theBatchId,theUid,knownMeta)=>{setLoading(true);setError(null);try{
    const meta=knownMeta||await loadBatchMeta(theBatchId);
    const[ls,rs,fb,jr,bd,rc]=await Promise.all([loadLessons(theBatchId,meta?.lessonCount,false),loadMyResponses(theBatchId,theUid),loadMyFeedback(theBatchId,theUid),loadMyJournal(theBatchId,theUid),loadMyBadges(theBatchId,theUid),loadRecap(theBatchId)]);
    setBatchMeta(meta);setLessons(ls);setResponses(rs);setFeedback(fb);setJournal(jr);setBadges(bd);setRecap(rc);
  }catch(e){setError("Could not load your lessons. Please check your connection.");}finally{setLoading(false);}},[]);

  // Admin: loads one batch's full detail for management.
  const loadBatchDetail=useCallback(async(theBatchId)=>{setLoading(true);setError(null);try{
    const[meta,wl,ls,rc,reqs]=await Promise.all([loadBatchMeta(theBatchId),rtGet(bp(theBatchId,"whitelist")),loadLessons(theBatchId,undefined,true),loadRecap(theBatchId),loadExtensionRequests(theBatchId)]);
    const registeredNames=await rtGet(bp(theBatchId,"registeredNames"));
    const[rs,fb]=await Promise.all([loadAllResponses(theBatchId,registeredNames),loadAllFeedback(theBatchId,registeredNames)]);
    setBatchMeta(meta);setWhitelist(wl||[]);setLessons(ls);setRecap(rc);setExtensionRequests(reqs);setResponses(rs);setFeedback(fb);
  }catch(e){setError("Could not connect to Firebase. Please check your internet connection.");}finally{setLoading(false);}},[]);

  const onSaveLesson=useCallback(async upd=>{const ok=await saveLesson(batchId,upd);if(ok)setLessons(prev=>prev.map(l=>l.id===upd.id?upd:l));return ok;},[batchId]);

  const onSubmitQuiz=useCallback(async entry=>{
    const full={...entry,uid};
    const ok=await saveResponse(batchId,uid,full);
    if(ok){
      const nextResponses=[...responses.filter(r=>r.lessonId!==entry.lessonId),full];
      setResponses(nextResponses);
      // Minimal (1) milestone: course-complete badge once every expected lesson has a response.
      const expected=batchMeta?.lessonCount||lessons.length;
      if(!badges.courseComplete&&nextResponses.length>=expected){
        await saveBadge(batchId,uid,"courseComplete",new Date().toISOString());
        setBadges(b=>({...b,courseComplete:true}));
        setNewBadge(true);
      }
    }
  },[batchId,uid,responses,badges,batchMeta,lessons]);

  const onSaveJournal=useCallback(async(lessonId,entry)=>{
    const ok=await saveJournalEntry(batchId,uid,lessonId,entry);
    if(ok)setJournal(prev=>({...prev,[lessonId]:entry}));
  },[batchId,uid]);

  // ── Admin batch-management actions ──
  const onSaveWhitelist=useCallback(async wl=>{await saveWhitelist(batchId,wl);setWhitelist(wl);},[batchId]);
  const onMarkComplete=useCallback(async()=>{await markCourseComplete(batchId,batchMeta);const m=await loadBatchMeta(batchId);setBatchMeta(m);setBatchIndex(await loadBatchIndex());},[batchId,batchMeta]);
  const onSetNextSession=useCallback(async iso=>{const m={...batchMeta,nextSessionAt:iso};await saveBatchMeta(batchId,m);setBatchMeta(m);},[batchId,batchMeta]);
  const onResolveExtension=useCallback(async(reqUid,granted)=>{await resolveExtensionRequest(batchId,reqUid,granted);const reqs=await loadExtensionRequests(batchId);setExtensionRequests(reqs);},[batchId]);
  const onSaveRecap=useCallback(async rc=>{await saveRecap(batchId,rc);setRecap(rc);},[batchId]);

  const enterStudent=(name,theBatchId,theUid,meta)=>{setStudent(name);setBatchId(theBatchId);setUid(theUid);setRole("student");loadStudentData(theBatchId,theUid,meta);};
  const enterAdmin=()=>{setUid(session.uid);setRole("admin");setAdminView("batches");setLoading(false);};
  const selectBatch=async(id)=>{setBatchId(id);setAdminView("dashboard");await loadBatchDetail(id);};
  const backToBatches=async()=>{setAdminView("batches");setBatchId(null);setBatchIndex(await loadBatchIndex());};
  const refreshAdmin=()=>batchId&&loadBatchDetail(batchId);
  const refreshBatchList=async()=>setBatchIndex(await loadBatchIndex());

  const retry=role==="admin"?(adminView==="dashboard"?refreshAdmin:refreshBatchList):role==="student"?()=>loadStudentData(batchId,uid,batchMeta):loadPublic;

  if(loading)return(<div style={{minHeight:"100vh",background:B.linen,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}><LotusImg size={60} float/><span style={{color:B.purple,fontSize:14,letterSpacing:1}}>Connecting…</span></div>);
  if(error)return(<div style={{minHeight:"100vh",background:B.linen,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,padding:24}}><LotusImg size={60}/><p style={{color:B.red,fontSize:14,textAlign:"center",maxWidth:300}}>{error}</p><button onClick={retry} style={{padding:"10px 24px",borderRadius:10,background:B.green,color:"white",border:"none",fontSize:14,cursor:"pointer"}}>Retry</button></div>);
  return(<>
    {!role&&<LoginScreen onStudent={()=>setRole("welcome")} onAdmin={enterAdmin}/>}
    {role==="welcome"&&<WelcomeScreen batchIndex={batchIndex} activeBatchId={activeBatchId} onEnter={enterStudent}/>}
    {role==="student"&&lessons&&<StudentDashboard studentName={student} lessons={lessons} responses={responses} feedback={feedback} journal={journal} badges={badges} recap={recap} batchMeta={batchMeta} onSubmitQuiz={onSubmitQuiz} onSaveJournal={onSaveJournal} newBadge={newBadge} onDismissBadge={()=>setNewBadge(false)}/>}
    {role==="admin"&&adminView==="batches"&&<div style={{minHeight:"100vh",background:B.linen}}><AppHeader bg={B.adminDark} admin sub="Admin"/><AdminBatches batchIndex={batchIndex} onSelect={selectBatch} onCreated={selectBatch} onRefresh={refreshBatchList}/></div>}
    {role==="admin"&&adminView==="dashboard"&&lessons&&<AdminDashboard batchId={batchId} batchMeta={batchMeta} lessons={lessons} responses={responses} feedback={feedback} whitelist={whitelist} recap={recap} extensionRequests={extensionRequests} onSaveLesson={onSaveLesson} onSaveWhitelist={onSaveWhitelist} onMarkComplete={onMarkComplete} onSetNextSession={onSetNextSession} onResolveExtension={onResolveExtension} onSaveRecap={onSaveRecap} onRefresh={refreshAdmin} onBackToBatches={backToBatches}/>}
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
